services:
  - type: web
    name: suivi-prospects
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: suivi-prospects-db
          property: connectionString

databases:
  - name: suivi-prospects-db
    plan: free
    databaseName: suivi_prospects
